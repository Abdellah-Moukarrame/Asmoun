services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: asmoun
      POSTGRES_USER: asmoun
      POSTGRES_PASSWORD: asmoun_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asmoun -d asmoun"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@asmoun.com
      PGADMIN_DEFAULT_PASSWORD: admin_dev
    ports:
      - "5052:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data: